name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch: # allows manual trigger from GitHub UI

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @games-of-chance/shared build

      - name: Build client
        run: pnpm --filter @games-of-chance/client build
        env:
          PARTYKIT_HOST: ${{ secrets.PARTYKIT_HOST }}

      - name: Deploy to Cloudflare
        run: pnpm --filter @games-of-chance/server exec partykit deploy --config ../../partykit.deploy.json
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
