<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Iron Crusher: Red/angular robot -->
  <!-- Head -->
  <polygon points="44,20 84,20 80,40 48,40" fill="#cc2222" stroke="#8b0000" stroke-width="2"/>
  <!-- Eyes -->
  <rect x="54" y="26" width="8" height="6" fill="#ffcc00"/>
  <rect x="66" y="26" width="8" height="6" fill="#ffcc00"/>
  <!-- Body -->
  <polygon points="40,42 88,42 92,90 36,90" fill="#e03030" stroke="#8b0000" stroke-width="2"/>
  <!-- Chest plate -->
  <rect x="52" y="52" width="24" height="20" fill="#8b0000" rx="2"/>
  <!-- Arms -->
  <rect x="20" y="44" width="16" height="40" fill="#cc2222" stroke="#8b0000" stroke-width="2" rx="3"/>
  <rect x="92" y="44" width="16" height="40" fill="#cc2222" stroke="#8b0000" stroke-width="2" rx="3"/>
  <!-- Fists -->
  <rect x="22" y="84" width="12" height="12" fill="#8b0000" rx="2"/>
  <rect x="94" y="84" width="12" height="12" fill="#8b0000" rx="2"/>
  <!-- Legs -->
  <rect x="44" y="92" width="16" height="28" fill="#cc2222" stroke="#8b0000" stroke-width="2" rx="2"/>
  <rect x="68" y="92" width="16" height="28" fill="#cc2222" stroke="#8b0000" stroke-width="2" rx="2"/>
  <!-- Feet -->
  <rect x="40" y="118" width="22" height="8" fill="#8b0000" rx="2"/>
  <rect x="66" y="118" width="22" height="8" fill="#8b0000" rx="2"/>
  <!-- Antenna -->
  <line x1="64" y1="20" x2="64" y2="10" stroke="#8b0000" stroke-width="2"/>
  <circle cx="64" cy="8" r="4" fill="#ffcc00"/>
</svg>
