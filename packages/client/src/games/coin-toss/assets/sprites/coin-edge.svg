<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="edgeGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="50%" stop-color="#B8860B" />
      <stop offset="100%" stop-color="#8B6914" />
    </linearGradient>
    <filter id="dropShadowE" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#00000040" />
    </filter>
  </defs>
  <!-- Thin edge view of coin (ellipse seen from the side) -->
  <ellipse cx="100" cy="100" rx="12" ry="85" fill="url(#edgeGradient)" stroke="#8B6914" stroke-width="2" filter="url(#dropShadowE)" />
  <!-- Grooved texture lines -->
  <line x1="100" y1="20" x2="100" y2="180" stroke="#DAA520" stroke-width="1" opacity="0.5" />
  <line x1="94" y1="25" x2="94" y2="175" stroke="#DAA520" stroke-width="0.5" opacity="0.3" />
  <line x1="106" y1="25" x2="106" y2="175" stroke="#DAA520" stroke-width="0.5" opacity="0.3" />
</svg>
